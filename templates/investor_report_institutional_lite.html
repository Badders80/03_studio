<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Investor Report: {{ horse_name }} ({{ asset_id }})</title>
    <style>
        body { font-family: 'Times New Roman', serif; color: #000; background: #fff; line-height: 1.5; padding: 0; margin: 0; }
        .page { width: 210mm; min-height: 297mm; padding: 20mm; margin: 10mm auto; border: 1px solid #eee; box-shadow: 0 0 10px rgba(0,0,0,0.05); position: relative; }
        .section-anchor { border-top: 4px solid #000; padding-top: 15px; margin-bottom: 60px; display: flex; justify-content: space-between; align-items: baseline; }
        .label { font-family: sans-serif; text-transform: uppercase; letter-spacing: 2.5px; font-size: 0.75rem; font-weight: 800; }
        .metadata { font-family: sans-serif; font-size: 0.75rem; color: #666; }
        .big-number { font-size: 5.5rem; font-weight: 400; letter-spacing: -2px; line-height: 1; }
        .pillar-grid { display: flex; justify-content: space-between; gap: 20px; font-family: sans-serif; margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 40px; }
        .pillar { flex: 1; text-align: center; }
        .pillar:not(:last-child) { border-right: 1px solid #eee; }
        .receipt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 100px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="page">
        <div class="section-anchor">
            <div class="label">Financial Distribution Summary</div>
            <div class="metadata">Asset ID {{ asset_id }} | {{ report_date }}</div>
        </div>
        <div style="margin-bottom: 70px;">
            <div class="label" style="color: #666; margin-bottom: 5px;">Return per Digital Token</div>
            <div class="big-number">{{ payout_aed }} AED</div>
            <div class="label" style="margin-top: 10px;">✓ DISTRIBUTION COMPLETED</div>
        </div>
        <div class="receipt-grid">
            <div>
                <h4 class="label" style="border-bottom: 1.5px solid #000; padding-bottom: 10px; margin-bottom: 25px;">Asset Performance</h4>
                <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee;">
                    <span>Total Stakes Earned</span>
                    <span style="font-weight: 700;">${{ total_stakes_nzd }} NZD</span>
                </div>
            </div>
            <div>
                <h4 class="label" style="border-bottom: 1.5px solid #000; padding-bottom: 10px; margin-bottom: 25px;">Distribution Mechanics</h4>
                <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee;">
                    <span>5% Lease Share</span>
                    <span style="font-weight: 700;">${{ lease_share_nzd }} NZD</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
